# params.yaml
# EDIT THIS:
dashboard_hotkey: f8
kill_hotkey: f12

# Camera device indices. If cameras stop being detected correctly after
# a reboot, USB replug, or on a different PC, run the camera enumeration
# check and update these numbers accordingly.
# EDIT THIS:
camera_index_top: 0
camera_index_side: 2

# Pixel-to-cm calibration ratios, written as "numerator / denominator".
# EDIT THIS:
ratio_top: "30 / 337"
ratio_side: "26 / 348"

# Distance from the side camera lens to its calibration reference line
# (the tape mark), in cm.
d_side_cal_cm: 50

# If testing shows the offset correction moves the height reading in the
# wrong direction, flip this to -1. Otherwise leave as 1.
side_offset_direction: 1